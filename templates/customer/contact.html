{% extends 'base.html' %}

{% block title %}Contact & Support — {{ app_name }}{% endblock %}

{% block content %}
<div class="page-header bg-light py-5 text-center">
    <div class="container">
        <h1 class="display-4 font-weight-bold">Contact & Support</h1>
        <p class="lead text-muted">Have a question or feedback? We'd love to hear from you.</p>
    </div>
</div>

<div class="container section-padding">
    <div class="contact-grid">
        <div class="contact-form-wrapper">
            <h3>Send Us a Message</h3>
            <form action="#" method="POST" onsubmit="event.preventDefault(); showToast('Thank you! Message sent successfully.', 'success');">
                <div class="form-group mb-3">
                    <label>Your Full Name</label>
                    <input type="text" class="form-control" placeholder="John Doe" required>
                </div>
                <div class="form-group mb-3">
                    <label>Email Address</label>
                    <input type="email" class="form-control" placeholder="john@example.com" required>
                </div>
                <div class="form-group mb-3">
                    <label>Subject</label>
                    <input type="text" class="form-control" placeholder="Order Inquiry / Feedback" required>
                </div>
                <div class="form-group mb-3">
                    <label>Message</label>
                    <textarea class="form-control" rows="4" placeholder="How can we assist you today?" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Send Message</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
