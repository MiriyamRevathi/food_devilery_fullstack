{% extends 'base.html' %}

{% block title %}500 Server Error — {{ app_name }}{% endblock %}

{% block content %}
<div class="error-page-container container text-center section-padding">
    <div class="error-visual">
        <span class="error-emoji">💥</span>
        <h1 class="error-code">500</h1>
    </div>
    <h2 class="error-title">Internal Server Error</h2>
    <p class="error-desc text-muted">Something went wrong on our end. Please try refreshing the page in a few moments.</p>

    <div class="error-actions mt-4">
        <a href="{{ url_for('main.home') }}" class="btn btn-primary btn-lg">Back to Home</a>
    </div>
</div>
{% endblock %}
