{% extends 'base.html' %}

{% block title %}403 Access Denied — {{ app_name }}{% endblock %}

{% block content %}
<div class="error-page-container container text-center section-padding">
    <div class="error-visual">
        <span class="error-emoji">🚫</span>
        <h1 class="error-code">403</h1>
    </div>
    <h2 class="error-title">Access Denied</h2>
    <p class="error-desc text-muted">You do not have permission to view this page or resource.</p>

    <div class="error-actions mt-4">
        <a href="{{ url_for('main.home') }}" class="btn btn-primary btn-lg">Back to Home</a>
    </div>
</div>
{% endblock %}
