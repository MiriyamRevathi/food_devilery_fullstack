{% extends 'base.html' %}

{% block title %}Edit Dish — {{ food.name }}{% endblock %}

{% block content %}
<div class="container section-padding">
    <div class="card p-4 max-w-700 mx-auto">
        <h2 class="font-weight-bold mb-3 border-bottom pb-2">Edit Dish Details ✏️</h2>

        <form action="{{ url_for('restaurant.edit_food', food_id=food.id) }}" method="POST">
            <div class="form-group mb-3">
                <label class="form-label">Dish Name</label>
                <input type="text" name="name" class="form-control" value="{{ food.name }}" required>
            </div>

            <div class="form-group mb-3">
                <label class="form-label">Description</label>
                <textarea name="description" class="form-control" rows="3" required>{{ food.description }}</textarea>
            </div>

            <div class="form-row flex-gap mb-3">
                <div class="form-group flex-1">
                    <label class="form-label">Regular Price (₹)</label>
                    <input type="number" step="0.01" name="price" class="form-control" value="{{ food.price }}" required>
                </div>
                <div class="form-group flex-1">
                    <label class="form-label">Discount Price (₹)</label>
                    <input type="number" step="0.01" name="discount_price" class="form-control" value="{{ food.discount_price }}" required>
                </div>
            </div>

            <div class="form-group mb-3">
                <label class="form-label">Dietary Preference</label>
                <div class="flex-center gap-4">
                    <label><input type="radio" name="is_veg" value="1" {% if food.is_veg %}checked{% endif %}> 🟢 Veg</label>
                    <label><input type="radio" name="is_veg" value="0" {% if not food.is_veg %}checked{% endif %}> 🔴 Non-Veg</label>
                </div>
            </div>

            <div class="form-group mb-4">
                <label class="form-label">Image URL</label>
                <input type="url" name="image" class="form-control" value="{{ food.image }}">
            </div>

            <div class="flex-between">
                <a href="{{ url_for('restaurant.menu') }}" class="btn btn-outline-primary">Cancel</a>
                <button type="submit" class="btn btn-primary">Update Dish</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
